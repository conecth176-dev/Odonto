[build]
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"

# SPA fallback: any page route falls back to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
